name: 2. Test Funkcjonalny Aplikacji (CRUD)

on:
  push:
    branches: [ test ] # ZMIENIONO: Uruchom przy push na gałąź 'test'
  pull_request:
    branches: [ test ] # ZMIENIONO: Uruchom przy Pull Requestach do gałęzi 'test'
  workflow_dispatch: # Pozwól na ręczne uruchomienie

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Services (MySQL DB & Python App)
        run: docker-compose up -d --build

      - name: Wait for Application to be Ready
        run: |
          echo "Waiting 30 seconds for the application to initialize the database..."
          sleep 30
          
      - name: 1. Health Check: GET /db-status
        run: |
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/db-status)
          
          if [ "$RESPONSE_CODE" -ne 200 ]; then
            echo "Test failed: /db-status returned status code $RESPONSE_CODE."
            echo "Full response:"
            curl http://localhost:8080/db-status
            exit 1
          fi
          echo "Health check OK. Status code: $RESPONSE_CODE"
          
      - name: 2. Functional Test: POST /users (Create User)
        run: |
          curl -X POST http://localhost:8080/users \
            -H "Content-Type: application/json" \
            -d '{"name": "Jan Kowalski", "email": "jan.kowalski@test.pl"}' \
            --fail-with-body
          echo "User creation successful."

      - name: 3. Functional Test: GET /users (List Users)
        run: |
          RESPONSE=$(curl -s http://localhost:8080/users)
          if ! echo "$RESPONSE" | grep -q "Jan Kowalski"; then
            echo "Test failed: 'Jan Kowalski' not found in user list."
            echo "Response was: $RESPONSE"
            exit 1
          fi
          echo "User listing successful."

      - name: Clean up: Stop and Remove Containers
        if: always()
        run: docker-compose down

