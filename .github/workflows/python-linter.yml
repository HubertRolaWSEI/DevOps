name: Python Code Linting and Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
jobs:
  lint-and-check:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' 

    - name: 3. Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r requirements.txt
        
    - name: 4. Lint with Flake8
      run: |
        echo "Running flake8 on server.py"
        flake8 server.py --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        
    - name: 5. Basic Syntax Check (Optional)
      run: |
        python -m py_compile server.py
