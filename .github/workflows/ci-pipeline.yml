name: CI/CD Pipeline - Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Pozwala na ręczne uruchomienie workflowu

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Używamy zmiennej środowiskowej do tagowania obrazu
    env:
      IMAGE_NAME: python-app-test

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 3. Build Docker Image for Testing
      # Budowanie obrazu na podstawie Dockerfile i nadanie mu tymczasowego tagu
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false # Nie wysyłamy obrazu do rejestru, tylko go budujemy
        tags: ${{ env.IMAGE_NAME }}:latest
        load: true # Załaduj obraz do lokalnego Dockera runnera, by docker-compose go znalazł
        
    - name: 4. Run Integration Tests (Start Services)
      # Zastąpienie domyślnego "image" w docker-compose.yml nazwą zbudowanego obrazu,
      # tak aby docker-compose użył świeżo zbudowanego kodu.
      run: |
        echo "Building and running services..."
        
        # Użycie docker-compose do uruchomienia aplikacji i bazy danych
        # Używamy opcji --build, aby upewnić się, że usługa "python-app" jest oparta na kontekście.
        # W tym środowisku, obraz jest już załadowany (load: true), więc build jest szybki lub pomijany.
        docker-compose up -d
        
        # Aplikacja ma mechanizm ponawiania połączenia, ale musimy dać czas na start MySQL (5s+5s)
        echo "Waiting 15 seconds for services to become healthy..."
        sleep 15
        
        # Test 1: Sprawdzenie statusu połączenia z bazą danych
        echo "Running DB status check (GET /db-status)..."
        # Opcja -f (fail) sprawi, że curl zwróci błąd, jeśli status HTTP nie jest 2xx/3xx (np. 500)
        curl -f http://localhost:8080/db-status
        
        # Test 2: Sprawdzenie, czy endpoint POST /users działa (próba stworzenia użytkownika)
        echo "Running User Creation Test (POST /users)..."
        curl -X POST http://localhost:8080/users \
             -H "Content-Type: application/json" \
             -d '{"name": "Test User", "email": "test@action.pl"}' \
             -f
             
        # Test 3: Sprawdzenie, czy użytkownik został dodany (GET /users)
        echo "Running User List Test (GET /users)..."
        curl -X GET http://localhost:8080/users -f | grep "Test User"

    - name: 5. Cleanup (Stop services)
      # Użycie if: always() gwarantuje, że kontenery zostaną zatrzymane, nawet jeśli testy zawiodą
      if: always()
      run: docker-compose down
